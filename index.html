<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C-based ASCII engine</title>
    <style>
        :root {
            --bg: #0d1117;
            --panel: #161b22;
            --text: #c9d1d9;
            --accent: #2ea043;
            --accent-hover: #3fb950;
            --border: #30363d;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI',
            Tahoma, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* --- SIDEBAR --- */
        #sidebar {
            width: 320px;
            background-color: var(--panel);
            padding: 25px 20px;
            border-right: 1px solid var(--border);
            overflow-y: auto;
            box-sizing: border-box;
            flex-shrink: 0;
        }
        h2 { 
            margin-top: 0;
            font-size: 1.3rem;
            color: #58a6ff; 
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
        }
        .control-group { margin-bottom: 20px; }
        label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            align-items: center;
        }
        .value-display {
            color: #8b949e;
            font-weight: normal; }
        
        input[type="range"] { width: 100%; cursor: pointer; }
        input[type="file"] { 
            width: 100%;
            margin-bottom: 20px;
            font-size: 0.85rem;
            padding: 8px;
            background: #010409;
            border: 1px solid var(--border);
            border-radius: 5px;
            color: var(--text);
        }

        /* --- INPUT BOX --- */
        .number-input {
            background: #010409;
            border: 1px solid var(--border);
            color: #58a6ff;
            border-radius: 4px;
            width: 60px;
            padding: 2px 5px;
            text-align: center;
            font-weight: bold;
            font-family: inherit;
            outline: none;
            transition: 0.2s;
        }
        .number-input:focus {
            border-color: #58a6ff;
        }
        .number-input::-webkit-outer-spin-button,
        .number-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .number-input[type=number] {
            -moz-appearance: textfield;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }
        .checkbox-group input {
            margin-right: 12px; cursor: pointer;
            width: 16px;
            height: 16px;
        }
        .checkbox-group label {
            margin-bottom: 0;
            font-weight: normal;
            cursor: pointer;
        }
        
        /* --- PRIMARY BUTTONS --- */
        button.primary-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 20px;
            letter-spacing: 1px;
        }
        button.primary-btn:hover {
            background-color: var(--accent-hover);
        }
        button.primary-btn:disabled {
            background-color: #21262d;
            color: #8b949e;
            cursor: not-allowed;
        }

        /* --- OUTPUT AREA --- */
        #output-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background-color: #010409;
            overflow: hidden;
        }

        .tabs-header {
            display: flex;
            width: 100%; 
            background: var(--panel);
            border-bottom: 1px solid var(--border);
        }
        .tab-btn {
            flex: 1;
            background: transparent;
            color: #8b949e;
            border: none;
            padding: 15px 20px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .tab-btn:hover {
            background: #21262d;
            color: var(--text);
        }
        .tab-btn.active {
            color: #58a6ff;
            border-bottom: 2px solid #58a6ff;
            background: #010409;
        }

        .tab-content {
            display: none;
            flex-grow: 1;
            width: 100%;
            overflow: auto;
            align-items:
            center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .tab-content.active {
            display: flex;
            flex-direction: column;
        }

        #previewImage {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        pre {
            margin: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 10px;
            line-height: 1;
            color: #c9d1d9;
            white-space: pre;
            text-align: center;
        }
        .placeholder {
            color: #484f58;
            font-size: 1rem;
            font-family: sans-serif;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Ascii engine</h2>
        
        <input type="file" id="imageInput" accept="image/png, image/jpeg, image/webp">
        
        <div class="control-group">
            <label>
                <span>Max width (px)</span> 
                <input type="number" id="maxWidthNum" class="number-input" min="50" max="1920" value="120">
            </label>
            <input type="range" id="maxWidth" min="50" max="1920" value="120">
        </div>

        <div class="control-group">
            <label><span>Contrast level</span> <span class="value-display" id="contrastVal">3</span></label>
            <input type="range" id="contrast" min="1" max="5" value="3" oninput="document.getElementById('contrastVal').innerText = this.value">
        </div>

        <hr style="border-color: var(--border); margin: 25px 0;">
        <label style="color: #8b949e; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px; margin-bottom: 15px;">Image Filters</label>

        <div class="checkbox-group">
            <input type="checkbox" id="doBlur"> <label for="doBlur">Gaussian blur (-b)</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="doEdge"> <label for="doEdge">Edge detection (-e)</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="doVector"> <label for="doVector">Vector map (-v)</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="doEmboss"> <label for="doEmboss">Emboss (-m)</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="doInvert"> <label for="doInvert">Invert colors (-i)</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="doDither" onchange="document.getElementById('ditherOpts').style.display = this.checked ? 'block' : 'none'"> 
            <label for="doDither">Atkinson dither (-d)</label>
        </div>
        
        <div id="ditherOpts" class="control-group" style="display: none; margin-left: 28px; padding-top: 10px;">
            <label style="font-size: 0.8rem;"><span>Shading levels</span> <span class="value-display" id="ditherVal">8</span></label>
            <input type="range" id="ditherLvl" min="2" max="15" value="8" oninput="document.getElementById('ditherVal').innerText = this.value">
        </div>

        <button id="renderBtn" class="primary-btn">RENDER ASCII</button>
    </div>

    <div id="output-area">
        <div class="tabs-header">
            <button class="tab-btn active" onclick="switchTab('original')">Original Image</button>
            <button class="tab-btn" onclick="switchTab('ascii')">ASCII Result</button>
        </div>

        <div class="tab-content active" id="tab-original">
            <div id="placeholder" class="placeholder">Upload an image to preview.</div>
            <img id="previewImage" style="display: none;">
        </div>

        <div class="tab-content" id="tab-ascii">
            <div id="asciiPlaceholder" class="placeholder">Render engine hasn't started yet.</div>
            <pre id="asciiOutput" style="display: none;"></pre>
        </div>
    </div>

    <script src="index.js"></script>

    <script>
        const btn = document.getElementById('renderBtn');
        const fileInput = document.getElementById('imageInput');
        
        const previewImg = document.getElementById('previewImage');
        const imgPlaceholder = document.getElementById('placeholder');
        
        const output = document.getElementById('asciiOutput');
        const asciiPlaceholder = document.getElementById('asciiPlaceholder');

        const maxWidthSlider = document.getElementById('maxWidth');
        const maxWidthNum = document.getElementById('maxWidthNum');

        maxWidthSlider.addEventListener('input', (e) => {
            maxWidthNum.value = e.target.value;
        });

        maxWidthNum.addEventListener('input', (e) => {
            let val = parseInt(e.target.value);
            if (!isNaN(val) && val >= 50 && val <= 1920) {
                maxWidthSlider.value = val;
            }
        });

        maxWidthNum.addEventListener('change', (e) => {
            let val = parseInt(e.target.value);
            if (isNaN(val) || val < 50) val = 50;
            if (val > 1920) val = 1920;
            e.target.value = val;
            maxWidthSlider.value = val;
        });

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');

            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');
        }

        fileInput.addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                const file = e.target.files[0];
                const objectURL = URL.createObjectURL(file);
                
                previewImg.src = objectURL;
                previewImg.style.display = 'block';
                imgPlaceholder.style.display = 'none';

                document.querySelector('.tabs-header button:nth-child(1)').click();
            }
        });

        btn.disabled = true;
        btn.innerText = "LOADING ENGINE...";
        
        Module.onRuntimeInitialized = function() {
            btn.innerText = 'RENDER ASCII';
            btn.disabled = false;
        };

        btn.addEventListener('click', async () => {
            if (!fileInput.files.length) {
                alert("Error: no input image!");
                return;
            }

            const file = fileInput.files[0];
            const arrayBuffer = await file.arrayBuffer();
            const uint8Array = new Uint8Array(arrayBuffer);

            const maxW = parseInt(maxWidthNum.value);
            const contrast = parseInt(document.getElementById('contrast').value);
            const ditherLvl = parseInt(document.getElementById('ditherLvl').value);
            
            const doBlur = document.getElementById('doBlur').checked ? 1 : 0;
            const doEdge = document.getElementById('doEdge').checked ? 1 : 0;
            const doEmboss = document.getElementById('doEmboss').checked ? 1 : 0;
            const doInvert = document.getElementById('doInvert').checked ? 1 : 0;
            const doDither = document.getElementById('doDither').checked ? 1 : 0;
            const doVector = document.getElementById('doVector').checked ? 1 : 0;

            btn.disabled = true;
            btn.innerText = "PROCESSING...";
            
            document.querySelector('.tabs-header button:nth-child(2)').click();
            asciiPlaceholder.style.display = 'none';
            output.style.display = 'block';
            output.textContent = "C-Core is calculating...";

            setTimeout(() => {
                const imgPtr = Module.ccall('jsMalloc', 'number', ['number'], [uint8Array.length]);
                Module.HEAPU8.set(uint8Array, imgPtr);

                const resultStrPtr = Module.ccall(
                    'process_image',
                    'number',
                    ['number', 'number', 'number', 'number', 'number', 'number', 'number', 'number', 'number', 'number', 'number'],
                    [imgPtr, uint8Array.length, maxW, contrast, ditherLvl, doBlur, doEdge, doEmboss, doDither, doInvert, doVector]
                );

                const asciiText = Module.UTF8ToString(resultStrPtr);
                
                output.textContent = asciiText;

                Module.ccall('jsFree', 'void', ['number'], [imgPtr]);
                Module.ccall('jsFree', 'void', ['number'], [resultStrPtr]); 

                btn.disabled = false;
                btn.innerText = 'RENDER ASCII';
            }, 50);
        });
    </script>
</body>
</html>
