<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C-based ASCII engine</title>
</head>
<body>

    <div id="sidebar">
        <h2>Ascii engine</h2>
        
        <input type="file" id="imageInput" accept="image/png, image/jpeg, image/webp">
        
        <div class="control-group">
            <label>
                <span>Max width (px)</span> 
                <input type="number" id="maxWidthNum" class="number-input" min="50" max="1920" value="850">
            </label>
            <input type="range" id="maxWidth" min="50" max="1920" value="850">
        </div>

        <div class="control-group">
            <label><span>Contrast level</span> <span class="value-display" id="contrastVal">3</span></label>
            <input type="range" id="contrast" min="1" max="5" value="3" oninput="document.getElementById('contrastVal').innerText = this.value">
        </div>

        <hr style="border-color: var(--border); margin: 25px 0;">
        <label style="color: #8b949e; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px; margin-bottom: 15px;">Image Filters</label>

        <div class="checkbox-group">
            <input type="checkbox" id="doBlur"> <label for="doBlur">Gaussian blur (-b)</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="doEdge"> <label for="doEdge">Edge detection (-e)</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="doVector"> <label for="doVector">Vector map (-v)</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="doEmboss"> <label for="doEmboss">Emboss (-m)</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="doInvert"> <label for="doInvert">Invert colors (-i)</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="doDither" onchange="document.getElementById('ditherOpts').style.display = this.checked ? 'block' : 'none'"> 
            <label for="doDither">Atkinson dither (-d)</label>
        </div>
        
        <div id="ditherOpts" class="control-group" style="display: none; margin-left: 28px; padding-top: 10px;">
            <label style="font-size: 0.8rem;"><span>Shading levels</span> <span class="value-display" id="ditherVal">8</span></label>
            <input type="range" id="ditherLvl" min="2" max="15" value="8" oninput="document.getElementById('ditherVal').innerText = this.value">
        </div>

        <button id="renderBtn" class="primary-btn">RENDER ASCII</button>
        <button id="downloadBtn" class="primary-btn" disabled style="background-color: #9ae2e9; margin-top: 10px;">DOWNLOAD OUTPUT ASCII FILE (.TXT)</button>
    </div>

    <div id="output-area">
        <div class="tabs-header">
            <button class="tab-btn active" onclick="switchTab('original')">Original Image</button>
            <button class="tab-btn" onclick="switchTab('ascii')">ASCII Result</button>
        </div>

        <div class="tab-content active" id="tab-original">
            <div id="placeholder" class="placeholder">Upload an image to preview.</div>
            <img id="previewImage" style="display: none;">
        </div>

        <div class="tab-content" id="tab-ascii">
            <div id="asciiPlaceholder" class="placeholder">Render engine hasn't started yet.</div>
            <pre id="asciiOutput" style="display: none;"></pre>
        </div>
    </div>

    <script src="index.js"></script>

    <script>
        const btn = document.getElementById('renderBtn');
        const fileInput = document.getElementById('imageInput');
        
        const previewImg = document.getElementById('previewImage');
        const imgPlaceholder = document.getElementById('placeholder');
        
        const output = document.getElementById('asciiOutput');
        const asciiPlaceholder = document.getElementById('asciiPlaceholder');

        const maxWidthSlider = document.getElementById('maxWidth');
        const maxWidthNum = document.getElementById('maxWidthNum');

        maxWidthSlider.addEventListener('input', (e) => {
            maxWidthNum.value = e.target.value;
        });

        maxWidthNum.addEventListener('input', (e) => {
            let val = parseInt(e.target.value);
            if (!isNaN(val) && val >= 50 && val <= 1920) {
                maxWidthSlider.value = val;
            }
        });

        maxWidthNum.addEventListener('change', (e) => {
            let val = parseInt(e.target.value);
            if (isNaN(val) || val < 50) val = 50;
            if (val > 1920) val = 1920;
            e.target.value = val;
            maxWidthSlider.value = val;
        });

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');

            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');
        }

        fileInput.addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                const file = e.target.files[0];
                const objectURL = URL.createObjectURL(file);
                
                previewImg.src = objectURL;
                previewImg.style.display = 'block';
                imgPlaceholder.style.display = 'none';

                document.querySelector('.tabs-header button:nth-child(1)').click();
            }
        });

        btn.disabled = true;
        btn.innerText = "LOADING ENGINE...";
        
        Module.onRuntimeInitialized = function() {
            btn.innerText = 'RENDER ASCII';
            btn.disabled = false;
        };

        btn.addEventListener('click', async () => {
            if (!fileInput.files.length) {
                alert("Error: no input image!");
                return;
            }

            const file = fileInput.files[0];
            const arrayBuffer = await file.arrayBuffer();
            const uint8Array = new Uint8Array(arrayBuffer);

            const maxW = parseInt(maxWidthNum.value);
            const contrast = parseInt(document.getElementById('contrast').value);
            const ditherLvl = parseInt(document.getElementById('ditherLvl').value);
            
            const doBlur = document.getElementById('doBlur').checked ? 1 : 0;
            const doEdge = document.getElementById('doEdge').checked ? 1 : 0;
            const doEmboss = document.getElementById('doEmboss').checked ? 1 : 0;
            const doInvert = document.getElementById('doInvert').checked ? 1 : 0;
            const doDither = document.getElementById('doDither').checked ? 1 : 0;
            const doVector = document.getElementById('doVector').checked ? 1 : 0;

            btn.disabled = true;
            btn.innerText = "PROCESSING...";
            
            document.querySelector('.tabs-header button:nth-child(2)').click();
            asciiPlaceholder.style.display = 'none';
            output.style.display = 'block';
            output.textContent = "C-Core is calculating...";

            setTimeout(() => {
                const imgPtr = Module.ccall('jsMalloc', 'number', ['number'], [uint8Array.length]);
                Module.HEAPU8.set(uint8Array, imgPtr);

                const resultStrPtr = Module.ccall(
                    'process_image',
                    'number',
                    ['number', 'number', 'number', 'number', 'number', 'number', 'number', 'number', 'number', 'number', 'number'],
                    [imgPtr, uint8Array.length, maxW, contrast, ditherLvl, doBlur, doEdge, doEmboss, doDither, doInvert, doVector]
                );

                const asciiText = Module.UTF8ToString(resultStrPtr);
                
                output.textContent = asciiText;
                document.getElementById('downloadBtn').disabled = false;

                Module.ccall('jsFree', 'void', ['number'], [imgPtr]);
                Module.ccall('jsFree', 'void', ['number'], [resultStrPtr]); 

                btn.disabled = false;
                btn.innerText = 'RENDER ASCII';
            }, 50);
        });

        document.getElementById('downloadBtn').addEventListener('click', () => {
        const text = document.getElementById('asciiOutput').textContent;
        
        // allocate a virtual file in RAM
        const blob = new Blob([text], { type: 'text/plain' });
        
        // create a temporary link to trigger download
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'ascii_output.txt';
        a.click();
        
        // free the temporary link
        URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
